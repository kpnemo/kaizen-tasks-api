name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kaizen_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-chars
      AI_MODEL_PROVIDER: fake
      APP_ENV: test
      WORKER_ENABLED: "false"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: docs check
        run: bash scripts/docs-check.sh --ci
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run build
      - run: bash scripts/check-dist-assets.sh
